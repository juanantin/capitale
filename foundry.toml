[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
lint_on_build = false

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
